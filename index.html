<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1D24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Carnet du bain</title>
</head>
<body>

<div id="app">
  <div class="boot">Chargement du carnet…</div>
</div>

<style>
  :root {
    --eau: #0E1D24;
    --eau-surface: #162C35;
    --eau-bord: #244550;
    --texte: #E6EFEE;
    --muted: #86A3A6;
    --braise: #D95A1E;
    --braise-clair: #F08A4B;
    --glacier: #4FB3C4;
    --laiton: #C79A5B;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  html, body {
    margin: 0;
    background: var(--eau);
    min-height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  #app {
    font-family: var(--sans);
    color: var(--texte);
    background: var(--eau);
    border-radius: 14px;
    padding: 0 0 28px;
    max-width: 560px;
    margin: 0 auto;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app *, #app *::before, #app *::after { box-sizing: border-box; }

  .boot { padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* ---- entête ---- */
  .hd {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--eau-bord);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .hd h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.2px;
    line-height: 1.15;
  }
  .hd p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
  .vol {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 12px; color: var(--laiton);
    white-space: nowrap;
  }
  .vol input {
    width: 52px; background: transparent; border: none;
    border-bottom: 1px dashed var(--eau-bord);
    color: var(--laiton); font-family: var(--mono); font-size: 13px;
    text-align: right; padding: 2px 2px 3px;
  }
  .vol input:focus { outline: none; border-bottom-color: var(--laiton); }

  /* ---- onglets ---- */
  .tabs { display: flex; border-bottom: 1px solid var(--eau-bord); }
  .tab {
    flex: 1; background: none; border: none; cursor: pointer;
    padding: 13px 4px 11px;
    font-family: var(--sans); font-size: 12.5px; font-weight: 550;
    color: var(--muted); letter-spacing: 0.2px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab[data-on="1"] { color: var(--texte); }
  .tab[data-k="chauffe"][data-on="1"] { border-bottom-color: var(--braise); }
  .tab[data-k="froid"][data-on="1"] { border-bottom-color: var(--glacier); }
  .tab[data-k="bilan"][data-on="1"] { border-bottom-color: var(--laiton); }
  .tab:focus-visible { outline: 2px solid var(--laiton); outline-offset: -3px; }

  .pan { padding: 18px; display: none; }
  .pan[data-on="1"] { display: block; }

  /* ---- formulaire ---- */
  .lg { font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase;
        color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
  .lg:first-child { margin-top: 0; }

  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; min-width: 0; }

  label.f { display: block; }
  label.f span {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 4px; letter-spacing: 0.1px;
  }
  input[type=number], input[type=time], input[type=date], input[type=text], select, textarea {
    width: 100%;
    background: var(--eau-surface);
    border: 1px solid var(--eau-bord);
    border-radius: 8px;
    color: var(--texte);
    font-family: var(--mono);
    font-size: 16px;
    padding: 10px 10px;
    -webkit-appearance: none;
    appearance: none;
  }
  select { font-family: var(--sans); font-size: 14px; }
  textarea { font-family: var(--sans); font-size: 14px; min-height: 58px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--laiton);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--eau-surface); border: 1px solid var(--eau-bord);
    color: var(--muted); border-radius: 20px; padding: 8px 13px;
    font-size: 12.5px; font-family: var(--sans); cursor: pointer;
  }
  .chip[data-on="1"] { color: var(--eau); background: var(--laiton); border-color: var(--laiton); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--laiton); outline-offset: 2px; }

  /* ---- signature : jauge d'écart ---- */
  .jauge {
    background: var(--eau-surface); border: 1px solid var(--eau-bord);
    border-radius: 10px; padding: 14px 14px 12px; margin: 16px 0 4px;
  }
  .jauge-bar {
    position: relative; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, var(--glacier) 0%, #2C6A78 35%, #8A5330 70%, var(--braise) 100%);
    opacity: 0.9;
  }
  .jauge-mk {
    position: absolute; top: -5px; width: 2px; height: 20px; background: var(--texte);
    border-radius: 1px; transition: left .18s ease;
  }
  .jauge-mk::after {
    content: attr(data-l); position: absolute; top: 22px; left: 50%;
    transform: translateX(-50%); font-family: var(--mono); font-size: 10px;
    color: var(--muted); white-space: nowrap;
  }
  .jauge-lg {
    display: flex; justify-content: space-between; margin-top: 28px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .jauge-ec { color: var(--texte); }

  /* ---- résultats ---- */
  .res {
    margin-top: 18px; border-top: 1px solid var(--eau-bord); padding-top: 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px;
  }
  .res div span {
    display: block; font-size: 10.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px;
  }
  .res div b {
    font-family: var(--mono); font-size: 19px; font-weight: 500; color: var(--texte);
  }
  .res div b em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 2px; }
  .res .hot b { color: var(--braise-clair); }
  .res .cold b { color: var(--glacier); }

  .btn {
    width: 100%; margin-top: 20px; padding: 14px;
    border-radius: 9px; border: none; cursor: pointer;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    background: var(--braise); color: #fff;
  }
  .btn.cold { background: var(--glacier); color: var(--eau); }
  .btn.ghost { background: transparent; border: 1px solid var(--eau-bord); color: var(--muted); font-weight: 500; font-size: 13px; padding: 11px; }
  .btn:focus-visible { outline: 2px solid var(--texte); outline-offset: 2px; }

  /* ---- relevés de refroidissement ---- */
  .rlv { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .rlv > label { flex: 1; }
  .rlv .del {
    background: none; border: 1px solid var(--eau-bord); color: var(--muted);
    border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 17px; flex: none;
  }

  /* ---- bilan ---- */
  .card {
    background: var(--eau-surface); border: 1px solid var(--eau-bord);
    border-radius: 10px; padding: 13px 14px; margin-bottom: 10px;
  }
  .card h3 {
    margin: 0 0 8px; font-size: 13px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .card h3 small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }
  .card p { margin: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .card p b { color: var(--texte); font-weight: 500; }
  .card .rm {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 11px; padding: 6px 0 0; text-decoration: underline;
  }
  .vide { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 6px 0 2px; }
  .note { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin-top: 14px; }
  .csv {
    width: 100%; height: 120px; margin-top: 10px; font-family: var(--mono); font-size: 10px;
    background: var(--eau-surface); border: 1px solid var(--eau-bord);
    color: var(--muted); border-radius: 8px; padding: 8px;
  }
  .flash {
    margin-top: 12px; font-size: 12.5px; color: var(--glacier); text-align: center;
    min-height: 16px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  var CLE = 'bain-nordique:v1';
  var CAP = 1.163;          // Wh pour élever 1 L de 1 °C
  var PCI_SEC = 5.14;       // kWh/kg de bois anhydre
  var VAP = 0.68;           // kWh/kg d'eau à vaporiser

  var D = { volume: 850, chauffes: [], froids: [] };
  var onglet = 'chauffe';
  var app = document.getElementById('app');

  /* ---------- utilitaires ---------- */
  function n(v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : null; }
  function f(x, d) { return x === null || !isFinite(x) ? '—' : x.toFixed(d === undefined ? 1 : d); }
  function auj() { return new Date().toISOString().slice(0, 10); }
  function hm() { var d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  function heures(a, b) {
    if (!a || !b) return null;
    var pa = a.split(':'), pb = b.split(':');
    var d = (+pb[0] * 60 + +pb[1]) - (+pa[0] * 60 + +pa[1]);
    if (d < 0) d += 1440;               // chauffe passant minuit
    return d / 60;
  }
  function pci(h) {
    var x = (h === null ? 20 : h) / 100;
    if (x < 0) x = 0; if (x > 0.65) x = 0.65;
    return PCI_SEC * (1 - x) - VAP * x;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- stockage ---------- */
  function charger() {
    try {
      var brut = localStorage.getItem(CLE);
      if (brut) {
        var o = JSON.parse(brut);
        D.volume = o.volume || 850;
        D.chauffes = o.chauffes || [];
        D.froids = o.froids || [];
      }
    } catch (e) { /* premier lancement, ou stockage indisponible */ }
    return Promise.resolve();
  }
  function sauver() {
    try {
      localStorage.setItem(CLE, JSON.stringify(D));
    } catch (e) {
      flash('Enregistrement impossible — copie la sauvegarde JSON avant de fermer.');
    }
    return Promise.resolve();
  }
  function flash(msg) {
    var e = document.getElementById('flash');
    if (!e) return;
    e.textContent = msg;
    setTimeout(function () { if (e.textContent === msg) e.textContent = ''; }, 3200);
  }

  /* ---------- calculs ---------- */
  function calcChauffe(c) {
    var dT = (c.t2 !== null && c.t1 !== null) ? c.t2 - c.t1 : null;
    var h = heures(c.h1, c.h2);
    var kwh = dT !== null ? D.volume * dT * CAP / 1000 : null;
    var vit = (dT !== null && h) ? dT / h : null;
    var kwhkg = (kwh !== null && c.kg) ? kwh / c.kg : null;
    var kgdeg = (c.kg && dT) ? c.kg / dT : null;
    var rend = (kwh !== null && c.kg) ? 100 * kwh / (c.kg * pci(c.hum)) : null;
    return { dT: dT, h: h, kwh: kwh, vit: vit, kwhkg: kwhkg, kgdeg: kgdeg, rend: rend };
  }

  // Loi de refroidissement : (T - Text) décroît de façon exponentielle.
  // k en h⁻¹ ; perte instantanée = k × écart.
  function calcFroid(r) {
    var pts = (r.pts || []).filter(function (p) { return p.h && p.te !== null && p.tx !== null; });
    var ks = [], tot = 0, dur = 0;
    for (var i = 1; i < pts.length; i++) {
      var dt = heures(pts[i - 1].h, pts[i].h);
      var e1 = pts[i - 1].te - pts[i - 1].tx;
      var e2 = pts[i].te - pts[i].tx;
      if (dt > 0 && e1 > 0.3 && e2 > 0.3 && e2 < e1) ks.push(Math.log(e1 / e2) / dt);
    }
    if (pts.length >= 2) {
      tot = pts[0].te - pts[pts.length - 1].te;
      dur = heures(pts[0].h, pts[pts.length - 1].h);
    }
    var k = ks.length ? ks.reduce(function (a, b) { return a + b; }, 0) / ks.length : null;
    var ecMoy = pts.length ? pts.reduce(function (a, p) { return a + (p.te - p.tx); }, 0) / pts.length : null;
    return {
      k: k, n: pts.length,
      perte: dur > 0 ? tot / dur : null,
      demi: k ? Math.log(2) / k : null,
      ecMoy: ecMoy
    };
  }

  /* ---------- état des formulaires ---------- */
  var fc = { date: auj(), h1: '', h2: '', t1: null, t2: null, tx: null,
             poele: 'Les deux', essence: 'Chêne', kg: null, hum: null,
             couv: 'Non', ciel: 'Couvert', vent: 'Léger', note: '' };
  var ff = { date: auj(), couv: 'Oui', pts: [ { h: '', te: null, tx: null }, { h: '', te: null, tx: null } ], note: '' };

  /* ---------- rendu ---------- */
  function vue() {
    app.innerHTML =
      '<div class="hd">' +
        '<div><h1>Carnet du bain</h1><p>Chauffe, refroidissement, bois</p></div>' +
        '<div class="vol"><input id="vol" type="number" inputmode="decimal" value="' + D.volume + '" aria-label="Volume d\'eau en litres"> L</div>' +
      '</div>' +
      '<div class="tabs">' +
        tab('chauffe', 'Chauffe') + tab('froid', 'Refroidissement') + tab('bilan', 'Bilan') +
      '</div>' +
      '<div class="pan" data-p="chauffe" data-on="' + (onglet === 'chauffe' ? 1 : 0) + '">' + panChauffe() + '</div>' +
      '<div class="pan" data-p="froid" data-on="' + (onglet === 'froid' ? 1 : 0) + '">' + panFroid() + '</div>' +
      '<div class="pan" data-p="bilan" data-on="' + (onglet === 'bilan' ? 1 : 0) + '">' + panBilan() + '</div>' +
      '<div class="flash" id="flash"></div>';
    brancher();
  }
  function tab(k, t) {
    return '<button class="tab" data-k="' + k + '" data-on="' + (onglet === k ? 1 : 0) + '">' + t + '</button>';
  }
  function ch(champ, val, cour) {
    return '<button class="chip" data-chip="' + champ + '" data-val="' + esc(val) + '" data-on="' + (cour === val ? 1 : 0) + '">' + esc(val) + '</button>';
  }
  function inp(cle, lib, type, val, form) {
    var v = val === null || val === undefined ? '' : val;
    return '<label class="f"><span>' + lib + '</span><input data-form="' + form + '" data-cle="' + cle +
      '" type="' + type + '"' + (type === 'number' ? ' inputmode="decimal" step="0.1"' : '') +
      ' value="' + esc(v) + '"></label>';
  }

  function panChauffe() {
    var r = calcChauffe(fc);
    return '' +
      '<div class="lg">Séance</div>' +
      '<div class="row">' + inp('date', 'Date', 'date', fc.date, 'c') +
        inp('tx', 'Extérieur °C', 'number', fc.tx, 'c') + '</div>' +
      '<div class="row">' + inp('h1', 'Feu allumé', 'time', fc.h1, 'c') +
        inp('h2', 'Feu éteint', 'time', fc.h2, 'c') + '</div>' +
      '<div class="row">' + inp('t1', 'Eau au départ °C', 'number', fc.t1, 'c') +
        inp('t2', 'Eau à l\'arrivée °C', 'number', fc.t2, 'c') + '</div>' +
      jauge(fc.tx, fc.t2) +
      '<div class="lg">Chauffe utilisée</div>' +
      '<div class="chips">' + ['Poêle 1', 'Poêle 2', 'Les deux', 'Serpentin seul'].map(function (v) { return ch('poele', v, fc.poele); }).join('') + '</div>' +
      '<div class="lg">Bois</div>' +
      '<div class="row">' +
        '<label class="f"><span>Essence</span><select data-form="c" data-cle="essence">' +
          ['Chêne', 'Hêtre', 'Charme', 'Frêne', 'Bouleau', 'Châtaignier', 'Résineux', 'Mixte', 'Aucun'].map(function (e) {
            return '<option' + (fc.essence === e ? ' selected' : '') + '>' + e + '</option>'; }).join('') +
        '</select></label>' +
        inp('kg', 'Masse kg', 'number', fc.kg, 'c') +
        inp('hum', 'Humidité %', 'number', fc.hum, 'c') +
      '</div>' +
      '<div class="lg">Conditions</div>' +
      '<div class="chips" style="margin-bottom:8px">' + ['Soleil', 'Éclaircies', 'Couvert', 'Pluie'].map(function (v) { return ch('ciel', v, fc.ciel); }).join('') + '</div>' +
      '<div class="chips" style="margin-bottom:8px">' + ['Vent nul', 'Léger', 'Fort'].map(function (v) { return ch('vent', v, fc.vent); }).join('') + '</div>' +
      '<div class="chips">Couverture&nbsp;' + ['Oui', 'Non'].map(function (v) { return ch('couv', v, fc.couv); }).join('') + '</div>' +
      '<div style="margin-top:12px">' + inp('note', 'Notes', 'text', fc.note, 'c') + '</div>' +
      '<div class="res">' +
        cel('Gain', f(r.dT) + '<em>°C</em>', 'hot') +
        cel('Durée', f(r.h) + '<em>h</em>', '') +
        cel('Vitesse', f(r.vit) + '<em>°C/h</em>', 'hot') +
        cel('Énergie dans l\'eau', f(r.kwh, 2) + '<em>kWh</em>', '') +
        cel('Rendement bois', f(r.kwhkg, 2) + '<em>kWh/kg</em>', 'hot') +
        cel('Bois par degré', f(r.kgdeg, 2) + '<em>kg/°C</em>', '') +
      '</div>' +
      '<button class="btn" data-act="save-c">Enregistrer la chauffe</button>' +
      '<p class="note">Le rendement estimé de l\'installation est calculé au bilan, à partir de l\'humidité saisie (20 % par défaut).</p>';
  }
  function cel(lib, val, cls) { return '<div class="' + cls + '"><span>' + lib + '</span><b>' + val + '</b></div>'; }

  function jauge(tx, te) {
    var a = tx === null ? null : tx, b = te === null ? null : te;
    var pos = function (t) { return Math.max(0, Math.min(100, ((t + 10) / 55) * 100)); };
    var ec = (a !== null && b !== null) ? b - a : null;
    return '<div class="jauge">' +
      '<div class="jauge-bar">' +
        (a !== null ? '<div class="jauge-mk" style="left:' + pos(a) + '%" data-l="ext ' + f(a) + '°"></div>' : '') +
        (b !== null ? '<div class="jauge-mk" style="left:' + pos(b) + '%" data-l="eau ' + f(b) + '°"></div>' : '') +
      '</div>' +
      '<div class="jauge-lg"><span>−10 °C</span><span class="jauge-ec">écart ' + f(ec) + ' °C</span><span>45 °C</span></div>' +
    '</div>';
  }

  function panFroid() {
    var r = calcFroid(ff);
    var lignes = ff.pts.map(function (p, i) {
      return '<div class="rlv">' +
        '<label class="f"><span>' + (i === 0 ? 'Feu éteint à' : 'Relevé ' + i) + '</span>' +
          '<input data-pt="' + i + '" data-cle="h" type="time" value="' + esc(p.h) + '"></label>' +
        '<label class="f"><span>Eau °C</span><input data-pt="' + i + '" data-cle="te" type="number" inputmode="decimal" step="0.1" value="' + (p.te === null ? '' : p.te) + '"></label>' +
        '<label class="f"><span>Ext. °C</span><input data-pt="' + i + '" data-cle="tx" type="number" inputmode="decimal" step="0.1" value="' + (p.tx === null ? '' : p.tx) + '"></label>' +
        (ff.pts.length > 2 ? '<button class="del" data-act="del-pt" data-i="' + i + '" aria-label="Supprimer ce relevé">×</button>' : '') +
      '</div>';
    }).join('');
    return '' +
      '<div class="lg">Nuit de refroidissement</div>' +
      '<div class="row">' + inp('date', 'Date', 'date', ff.date, 'f') +
        '<div class="chips" style="align-items:flex-end">Couverture&nbsp;' + ['Oui', 'Non'].map(function (v) { return ch('fcouv', v, ff.couv); }).join('') + '</div></div>' +
      '<div class="lg">Relevés</div>' + lignes +
      '<button class="btn ghost" data-act="add-pt">+ Ajouter un relevé</button>' +
      '<div class="res">' +
        cel('Perte moyenne', f(r.perte, 2) + '<em>°C/h</em>', 'cold') +
        cel('Écart moyen', f(r.ecMoy) + '<em>°C</em>', '') +
        cel('Constante k', f(r.k, 4) + '<em>/h</em>', 'cold') +
        cel('Demi-écart en', f(r.demi) + '<em>h</em>', '') +
      '</div>' +
      '<p class="note">k est la vraie signature de ton bain : la perte vaut k × écart eau/extérieur. Un k stable d\'une nuit à l\'autre veut dire que tes relevés sont bons. « Demi-écart » = temps pour perdre la moitié de l\'écart avec l\'extérieur.</p>' +
      '<div style="margin-top:6px">' + inp('note', 'Notes', 'text', ff.note, 'f') + '</div>' +
      '<button class="btn cold" data-act="save-f">Enregistrer le refroidissement</button>';
  }

  function panBilan() {
    var h = '';
    if (!D.chauffes.length && !D.froids.length) {
      h += '<p class="vide">Rien d\'enregistré pour l\'instant.<br>Trois ou quatre chauffes suffisent déjà pour voir sortir une tendance ; compte une dizaine avant de comparer sérieusement deux essences.</p>';
    }
    if (D.chauffes.length) {
      h += '<div class="lg">Par essence</div>';
      var par = {};
      D.chauffes.forEach(function (c) {
        var r = calcChauffe(c);
        if (r.kwhkg === null) return;
        (par[c.essence] = par[c.essence] || []).push(r);
      });
      Object.keys(par).forEach(function (e) {
        var l = par[e];
        var moy = function (f2) { var v = l.map(f2).filter(function (x) { return x !== null && isFinite(x); });
          return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; };
        h += '<div class="card"><h3>' + esc(e) + ' <small>' + l.length + ' chauffe' + (l.length > 1 ? 's' : '') + '</small></h3>' +
          '<p><b>' + f(moy(function (r) { return r.kwhkg; }), 2) + '</b> kWh/kg &nbsp;·&nbsp; <b>' +
          f(moy(function (r) { return r.kgdeg; }), 2) + '</b> kg/°C &nbsp;·&nbsp; <b>' +
          f(moy(function (r) { return r.vit; }), 2) + '</b> °C/h<br>rendement estimé <b>' +
          f(moy(function (r) { return r.rend; }), 0) + ' %</b></p></div>';
      });
      h += '<div class="lg">Chauffes</div>';
      D.chauffes.slice().reverse().forEach(function (c) {
        var r = calcChauffe(c);
        h += '<div class="card"><h3>' + esc(c.date) + ' <small>' + esc(c.poele) + '</small></h3>' +
          '<p>' + f(c.t1) + ' → ' + f(c.t2) + ' °C en <b>' + f(r.h) + ' h</b> · ext. ' + f(c.tx) + ' °C<br>' +
          esc(c.essence) + ' <b>' + f(c.kg) + ' kg</b> · ' + f(r.kwhkg, 2) + ' kWh/kg' +
          (c.note ? '<br>' + esc(c.note) : '') + '</p>' +
          '<button class="rm" data-act="rm-c" data-id="' + c.id + '">Supprimer</button></div>';
      });
    }
    if (D.froids.length) {
      var ks = D.froids.map(calcFroid).map(function (r) { return r.k; }).filter(function (x) { return x !== null; });
      var kM = ks.length ? ks.reduce(function (a, b) { return a + b; }, 0) / ks.length : null;
      h += '<div class="lg">Refroidissement</div>';
      if (kM) {
        h += '<div class="card"><h3>Constante moyenne <small>' + ks.length + ' nuit' + (ks.length > 1 ? 's' : '') + '</small></h3>' +
          '<p>k = <b>' + f(kM, 4) + '</b> /h<br>' +
          'écart 20 °C → <b>' + f(kM * 20, 2) + ' °C/h</b><br>' +
          'écart 30 °C → <b>' + f(kM * 30, 2) + ' °C/h</b></p></div>';
      }
      D.froids.slice().reverse().forEach(function (r0) {
        var r = calcFroid(r0);
        h += '<div class="card"><h3>' + esc(r0.date) + ' <small>couverture ' + esc(r0.couv).toLowerCase() + '</small></h3>' +
          '<p>' + r.n + ' relevés · perte <b>' + f(r.perte, 2) + ' °C/h</b> · écart moyen ' + f(r.ecMoy) + ' °C<br>k = <b>' + f(r.k, 4) + '</b> /h' +
          (r0.note ? '<br>' + esc(r0.note) : '') + '</p>' +
          '<button class="rm" data-act="rm-f" data-id="' + r0.id + '">Supprimer</button></div>';
      });
    }
    h += '<div class="lg">Export et sauvegarde</div>' +
      '<textarea class="csv" id="csv" placeholder="Le tableau ou la sauvegarde apparaîtra ici. Pour restaurer, colle une sauvegarde JSON dans cette zone puis appuie sur Restaurer."></textarea>' +
      '<button class="btn ghost" data-act="csv">Générer le CSV</button>' +
      '<button class="btn ghost" data-act="json">Générer la sauvegarde JSON</button>' +
      '<button class="btn ghost" data-act="restore">Restaurer depuis la zone</button>' +
      '<p class="note">Les données vivent dans le stockage du navigateur. Vider les données du site les efface : garde une sauvegarde JSON quelque part après chaque série de relevés.</p>';
    return h;
  }

  /* ---------- interactions ---------- */
  function brancher() {
    app.querySelectorAll('.tab').forEach(function (b) {
      b.onclick = function () { onglet = b.dataset.k; vue(); };
    });
    var v = document.getElementById('vol');
    if (v) v.onchange = function () { D.volume = n(v.value) || 850; sauver(); vue(); };

    app.querySelectorAll('[data-form]').forEach(function (el) {
      el.oninput = function () {
        var o = el.dataset.form === 'c' ? fc : ff;
        var cle = el.dataset.cle;
        o[cle] = (el.type === 'number') ? n(el.value) : el.value;
        if (el.type === 'number' && ['t1', 't2', 'tx'].indexOf(cle) >= 0) majLive();
        else if (el.type !== 'text') majLive();
      };
    });
    app.querySelectorAll('[data-pt]').forEach(function (el) {
      el.oninput = function () {
        var p = ff.pts[+el.dataset.pt];
        p[el.dataset.cle] = el.type === 'number' ? n(el.value) : el.value;
        majLive();
      };
    });
    app.querySelectorAll('[data-chip]').forEach(function (b) {
      b.onclick = function () {
        var c = b.dataset.chip;
        if (c === 'fcouv') ff.couv = b.dataset.val; else fc[c] = b.dataset.val;
        vue();
      };
    });
    app.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { act(b); }; });
  }

  // met à jour les cases de résultat sans reconstruire le formulaire (le clavier reste ouvert)
  function majLive() {
    var pan = app.querySelector('.pan[data-p="' + onglet + '"]');
    if (!pan) return;
    var res = pan.querySelector('.res');
    if (onglet === 'chauffe') {
      var r = calcChauffe(fc);
      remplir(res, [f(r.dT) + '<em>°C</em>', f(r.h) + '<em>h</em>', f(r.vit) + '<em>°C/h</em>',
                    f(r.kwh, 2) + '<em>kWh</em>', f(r.kwhkg, 2) + '<em>kWh/kg</em>', f(r.kgdeg, 2) + '<em>kg/°C</em>']);
      var j = pan.querySelector('.jauge');
      if (j) j.outerHTML = jauge(fc.tx, fc.t2);
    } else if (onglet === 'froid') {
      var q = calcFroid(ff);
      remplir(res, [f(q.perte, 2) + '<em>°C/h</em>', f(q.ecMoy) + '<em>°C</em>',
                    f(q.k, 4) + '<em>/h</em>', f(q.demi) + '<em>h</em>']);
    }
  }
  function remplir(res, vals) {
    if (!res) return;
    var bs = res.querySelectorAll('b');
    vals.forEach(function (v, i) { if (bs[i]) bs[i].innerHTML = v; });
  }

  function act(b) {
    var a = b.dataset.act;
    if (a === 'add-pt') {
      ff.pts.push({ h: hm(), te: null, tx: ff.pts[ff.pts.length - 1].tx });
      vue();
    } else if (a === 'del-pt') {
      ff.pts.splice(+b.dataset.i, 1); vue();
    } else if (a === 'save-c') {
      if (fc.t1 === null || fc.t2 === null) { flash('Il manque les températures de l\'eau.'); return; }
      fc.id = Date.now();
      D.chauffes.push(JSON.parse(JSON.stringify(fc)));
      sauver().then(function () {
        fc = { date: auj(), h1: '', h2: '', t1: null, t2: null, tx: fc.tx,
               poele: fc.poele, essence: fc.essence, kg: null, hum: fc.hum,
               couv: fc.couv, ciel: fc.ciel, vent: fc.vent, note: '' };
        onglet = 'bilan'; vue(); flash('Chauffe enregistrée.');
      });
    } else if (a === 'save-f') {
      var q = calcFroid(ff);
      if (q.n < 2) { flash('Il faut au moins deux relevés complets.'); return; }
      ff.id = Date.now();
      D.froids.push(JSON.parse(JSON.stringify(ff)));
      sauver().then(function () {
        ff = { date: auj(), couv: ff.couv, pts: [ { h: '', te: null, tx: null }, { h: '', te: null, tx: null } ], note: '' };
        onglet = 'bilan'; vue(); flash('Refroidissement enregistré.');
      });
    } else if (a === 'rm-c') {
      D.chauffes = D.chauffes.filter(function (c) { return String(c.id) !== b.dataset.id; });
      sauver().then(vue);
    } else if (a === 'rm-f') {
      D.froids = D.froids.filter(function (c) { return String(c.id) !== b.dataset.id; });
      sauver().then(vue);
    } else if (a === 'csv') {
      document.getElementById('csv').value = csv();
    } else if (a === 'json') {
      document.getElementById('csv').value = JSON.stringify(D);
    } else if (a === 'restore') {
      var t = document.getElementById('csv').value.trim();
      if (!t) { flash('Colle d\'abord une sauvegarde JSON dans la zone.'); return; }
      try {
        var o = JSON.parse(t);
        if (!o || !Array.isArray(o.chauffes)) throw new Error('format');
        D.volume = o.volume || 850;
        D.chauffes = o.chauffes;
        D.froids = Array.isArray(o.froids) ? o.froids : [];
        sauver().then(function () { vue(); flash('Sauvegarde restaurée.'); });
      } catch (e) {
        flash('Ce texte n\'est pas une sauvegarde JSON valide.');
      }
    }
  }

  function csv() {
    var l = ['type;date;t_eau_debut;t_eau_fin;t_ext;duree_h;essence;masse_kg;humidite;poele;couverture;ciel;vent;kwh_eau;kwh_par_kg;kg_par_degre;k_par_h;perte_C_par_h;notes'];
    D.chauffes.forEach(function (c) {
      var r = calcChauffe(c);
      l.push(['chauffe', c.date, c.t1, c.t2, c.tx, f(r.h, 2), c.essence, c.kg, c.hum, c.poele, c.couv, c.ciel, c.vent,
              f(r.kwh, 2), f(r.kwhkg, 3), f(r.kgdeg, 3), '', '', c.note].join(';'));
    });
    D.froids.forEach(function (x) {
      var r = calcFroid(x);
      var p0 = (x.pts[0] || {}), pN = (x.pts[x.pts.length - 1] || {});
      l.push(['refroidissement', x.date, p0.te, pN.te, f(r.ecMoy, 1), f(heures(p0.h, pN.h), 2), '', '', '', '', x.couv, '', '',
              '', '', '', f(r.k, 4), f(r.perte, 2), x.note].join(';'));
    });
    return l.join('\n').replace(/null/g, '');
  }

  charger().then(vue);
})();
</script>

</body>
